<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Debt Manager Pro - Debt Collection Management</title>
    <meta name="description" content="Professional debt collection management software with payment runner, portfolio tracking, and collector seat management" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link id="app-manifest" rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Debt Manager Pro" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Pick the right web app manifest based on the page being viewed so
      // installing from a collector page installs the collector PWA and
      // installing from anywhere else installs the admin PWA.
      (function () {
        try {
          var path = window.location.pathname || '/';
          var isCollectorPage =
            path.indexOf('/collector-login') === 0 ||
            path.indexOf('/collector-install') === 0;
          var link = document.getElementById('app-manifest');
          if (link) {
            var desired = isCollectorPage ? '/manifest-collector.json' : '/manifest.json';
            if (link.getAttribute('href') !== desired) {
              link.setAttribute('href', desired);
            }
          }
        } catch (e) {
          // ignore
        }
      })();

      // One-time cleanup for users who already installed an earlier service
      // worker: unregister any obsolete worker registered from a different
      // script URL so the new versioned worker can take over cleanly. Cache
      // pruning is handled by the active worker's own activate handler.
      (function () {
        var CLEANUP_KEY = 'sw-cleanup-v7';
        try {
          if (localStorage.getItem(CLEANUP_KEY) === '1') return;
          if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
            var expectedScript = new URL('/sw.js', window.location.origin).href;
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (reg) {
                var current = reg.active || reg.installing || reg.waiting;
                if (current && current.scriptURL && current.scriptURL !== expectedScript) {
                  return reg.unregister().catch(function () {});
                }
                return undefined;
              }));
            }).then(function () {
              localStorage.setItem(CLEANUP_KEY, '1');
            }).catch(function () {});
          } else {
            localStorage.setItem(CLEANUP_KEY, '1');
          }
        } catch (e) {
          // ignore
        }
      })();

      // Service worker registration + update handling now lives in the app
      // (see client/src/lib/pwa-update.ts) so it can show an in-app
      // "new version available" prompt.
    </script>
  </body>
</html>
